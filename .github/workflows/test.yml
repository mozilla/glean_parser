name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

# Drop all default GITHUB_TOKEN permissions; each job declares its own least-privilege set.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-latest
          - python-version: "3.9"
            os: ubuntu-latest
            minimum-versions: true
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - &setup-python
        name: Set up Python
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install glean_parser
        if: matrix.minimum-versions != true
        run: CC=broken_compiler uv sync

      - name: Install minimum requirements
        if: matrix.minimum-versions == true
        run: |
          uv sync --resolution lowest-direct

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.343.0
        with:
          ruby-version: '3.4'

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Kotlin linters
        run: make install-kotlin-linters

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.26"
          cache: false

      - name: Python tests
        run: |
          make test-full

      - name: Build docs
        if: matrix.python-version == '3.12'
        run: |
          make docs

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - *checkout

      - *setup-python

      - name: Lint
        run: make lint

  license-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - *checkout

      - *setup-python

      - name: License check
        run: make license-check

  code-security-analysis:
    permissions:
      contents: read
      actions: read
    uses: mozilla/ssdlc-actions/.github/workflows/code-security-analysis-public-repo.yml@e9f3e1160146ff2bad75433503e410d71835de80 # 2026-11-20

  report-result:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - test-python
      - lint
      - license-check
      - code-security-analysis
    steps:
      - name: Determine result
        run: |
          echo "$RESULTS" | grep -v failure
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
