# This file defines the pings that are recorded by server-side Glean.
# Their code APIs is automatically generated, at build time using,
# the `glean_parser` PyPI package.

---
$schema: moz://mozilla.org/schemas/glean/pings/2-0-0

events:
  description: |
    The events ping's purpose is to transport all of the event metric
    information. The `events` ping is automatically sent when the application
    becomes inactive.
  include_client_id: true
  bugs:
    - https://bugzilla.mozilla.org/1512938
  data_reviews:
    - https://bugzilla.mozilla.org/show_bug.cgi?id=1512938#c3
  notification_emails:
    - glean-team@mozilla.com

server-deletion-request:
  description: |
    This ping is submitted when a server application needs to request
    deletion of a user's telemetry data from the warehouse.
    Unlike the SDK's `deletion-request` ping, server applications have no
    Glean-managed `client_id`, so this ping carries application-defined
    identifier metrics that the pipeline uses to find the data to delete.
  include_client_id: false
  bugs:
    - https://mozilla-hub.atlassian.net/browse/DENG-4079
  data_reviews:
    - https://bugzilla.mozilla.org/show_bug.cgi?id=1587095
  notification_emails:
    - glean-team@mozilla.com
