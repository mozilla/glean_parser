---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0

onboarding:
  started: &event
    type: event
    description: Onboarding started.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2077133
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2077133
    notification_emails:
      - nobody@example.com
    expires: never
  finished: *event
  dismissed: *event
  card_shown: *event

checkout:
  started: *event
  paid: *event
